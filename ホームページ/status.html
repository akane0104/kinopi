<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ぴのきー。｜シリアルナンバーで、ご依頼の進捗を確認できます。" />
    <title>ぴのきー。 | 進捗確認</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%B7%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="status.css" />
  </head>
  <body>
    <div class="sparkles" aria-hidden="true"><i>✦</i><i>♥</i><i>✧</i><i>✦</i><i>●</i></div>
    <header class="site-header">
      <a href="index.html" class="brand" aria-label="ぴのきー。トップへ"><span class="brand-dot">●</span><span>ぴのきー。</span></a>
      <nav class="main-nav" aria-label="メインメニュー"><a href="index.html#estimate">依頼を相談する</a></nav>
    </header>

    <main class="status-main section-pad">
      <section class="status-intro">
        <p class="section-tag">order status <span>♡</span></p>
        <h1>ご依頼の進捗を確認する</h1>
        <p>お渡ししたシリアルナンバーを入力すると、いまの進捗状況を確認できます。</p>
      </section>

      <form id="status-form" class="status-form">
        <label>シリアルナンバー<input id="status-serial" name="serial" required placeholder="PNK-260916-LT8H" autocomplete="off" /></label>
        <button class="button bubble" type="submit">確認する <span>→</span></button>
        <p id="status-message" class="form-message"></p>
      </form>

      <section id="status-result" class="status-result" hidden>
        <div class="status-card">
          <div class="status-card-head">
            <span class="serial-tag" id="status-serial-tag"></span>
            <b id="status-name"></b>
          </div>
          <p class="order-status-badge-line"><span id="status-badge" class="order-status-badge"></span></p>

          <div class="status-two">
            <div><small>受付日</small><b id="status-created">—</b></div>
            <div><small>納品予定日</small><b id="status-due">—</b></div>
          </div>

          <div class="status-progress">
            <div class="status-progress-head"><b id="status-percent">0%</b><span id="status-count">0 / 0 完了</span></div>
            <div class="status-progress-bar"><i id="status-progress-fill"></i></div>
          </div>

          <div id="status-processes" class="status-processes"></div>

          <div class="status-rev">
            <small>無料修正</small>
            <b id="status-rev-text">—</b>
          </div>

          <p class="status-hint">※ もっと詳しいご連絡は、ぴのきー。から直接お送りします。表示内容についてご不明な点があれば、いつでもご連絡ください。</p>
        </div>
      </section>
    </main>

    <footer><a class="brand" href="index.html"><span class="brand-dot">●</span><span>ぴのきー。</span></a><p>© 2026 PINOKII.</p></footer>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="status.js"></script>
  </body>
</html>
